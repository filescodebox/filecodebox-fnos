name: Release
# 打 v* tag → 两路发布(2026-10-09 起只发原生 fpk,Docker 镜像链路已整体移除):
#   1. fpk + attach-fpk: fnpack 打应用包,挂本仓 Release(GITHUB_TOKEN 同仓写即可)
#   2. attach-to-hub: 回挂 fpk 到生态主仓 pigeonbox/pigeonbox 的 Release(tag fnos-v*,
#      与 desktop 回挂 desktop-v* 同模式——所有二进制产物统一在主仓 Releases 可下载;
#      跨仓写用 FNOS_PAT;断链必须响(2026-10-08 拔除 continue-on-error——PAT 失效静默放行只会让 hub 统一出口缺资产)
# workflow_dispatch: 传 version(现有 tag 名,如 v0.3.0)对该版本手动重跑 fpk 打包+双挂,用于验证/补救
# (2026-10-04 随仓改名 pigeonbox-fnos → fnos 对齐;ghcr 镜像 ghcr.io/pigeonbox/fnos 停止发布,冻结在 v1.14.6)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.3.0)。仅重跑 fpk 打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  fpk:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,fpk 与 tag 构建严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - name: 版本一致性断言(manifest 与 tag 对齐;VERSION 为列车真相源)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION"; exit 1; }
          fi
          MV=$(awk -F= '$1=="version"{print $2}' fnos/manifest)
          [ "$MV" = "${VER#v}" ] || { echo "::error::fnos/manifest version=$MV ≠ tag $VER——发版走 hub 列车 bump,勿手改 manifest"; exit 1; }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: 原生产物构建(双架构二进制+前端,版本注入随构建脚本)
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-native.sh
      - name: 下载 fnpack(官方 CLI,与 ci.yml package job 同源)
        run: |
          # 供应链:fnpack 是产出 .fpk(用户装到 NAS 上的应用包)的打包器,厂商 CDN
          # 上的二进制必须钉摘要。摘要取自:
          #   URL:    https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          #   采集日: 2026-10-21(厂商 Last-Modified: Fri, 03 Jul 2026 06:30:35 GMT)
          # 厂商换版本/换构建即摘要不符→此处红,是显式决策点,不是静默换包。
          curl -fsSL --retry 3 -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          chmod +x fnpack
      - name: fnpack build
        run: cd fnos && ../fnpack build
      # pb CLI 随包门禁（**发布流水线硬断言**）
      #
      # 为什么断言放在 release 而不是 CI：
      #   · CI（bump PR）阶段 server 的同号 tag **还不存在** ⇒ pb 编不出来是预期的
      #     ⇒ 那里硬断会让 bump PR 合不进去 ⇒ 列车死锁；
      #   · release（tag push）阶段 server tag **已可见**（hub#232 加了
      #     「server 之后等 tag 可见」的顺序保证）⇒ pb 必定编得出
      #     ⇒ 这里才是「**发布出去的包必须含 pb**」的真正断言点。
      - name: pb CLI 随包门禁（发布流水线硬断言）
        run: PB_REQUIRED=1 bash scripts/check-pb-in-fpk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pigeonbox-fpk
          path: fnos/pigeonbox.fpk
          retention-days: 14
          if-no-files-found: error

  attach-fpk:
    needs: fpk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pigeonbox-fpk
          path: fpk
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox fnOS ${VER}" \
              --notes "飞牛 fnOS 原生应用包(见 Assets pigeonbox.fpk,内含双架构二进制+前端,安装/运行免 Docker 免镜像拉取)。"
          gh release upload "${VER}" fpk/pigeonbox.fpk --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: fpk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pigeonbox-fpk
          path: fpk
      - name: 回挂 fpk 到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: fnos-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/fnos](https://github.com/pigeonbox/fnos) · **完整变更日志**: [%s](https://github.com/pigeonbox/fnos/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "飞牛 fnOS 原生应用包(见 Assets,免 Docker 免镜像拉取)。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox fnOS ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" fpk/pigeonbox.fpk --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: fnos-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"fnos\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
